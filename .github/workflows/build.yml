name: Kisan Mandi Android Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check V2 ZIP
        shell: bash
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/Kisan_Mandi_com.kisanmandi.india_v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: kisan_mandi_v2_fixed.zip not found"
            exit 1
          fi

          echo "V2 ZIP found successfully."
          ls -lh "$ZIP_FILE"

      - name: Extract V2 Android project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build_src"
          mkdir -p "$GITHUB_WORKSPACE/build_src"

          unzip -q "$GITHUB_WORKSPACE/Kisan_Mandi_com.kisanmandi.india_v1.zip" \
            -d "$GITHUB_WORKSPACE/build_src"

          echo "V2 Android project extracted successfully."
          echo "Project files:"
          ls -la "$GITHUB_WORKSPACE/build_src"

      - name: Check Android project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/build_src"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Files inside build_src:"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Android project is valid."
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "Project: $PROJECT_DIR"

      - name: Prepare signing key
  shell: bash
  env:
    KISAN_KEYSTORE_B64: ${{ secrets.KISAN_KEYSTORE_B64 }}
  run: |
    echo "$KISAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kisan-mandi-production-2026.p12"

- name: Build Android AAB
  shell: bash
  env:
    KISAN_KEYSTORE: ${{ runner.temp }}/kisan-mandi-production-2026.p12
    KISAN_KEYSTORE_PASSWORD: ${{ secrets.KISAN_KEYSTORE_PASSWORD }}
    KISAN_KEY_ALIAS: kisanmandi
    KISAN_KEY_PASSWORD: ${{ secrets.KISAN_KEY_PASSWORD }}
  run: |
    cd "$PROJECT_DIR"
    gradle :app:bundleRelease --no-daemon
      - name: Verify AAB
        shell: bash
        run: |
          AAB_FILE="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mandi-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
