name: Kisan Mandi Android Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check KM ZIP
        shell: bash
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/KM.zip" ]; then
            echo "ERROR: KM.zip not found."
            exit 1
          fi
          echo "KM.zip found successfully."

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build_src"
          mkdir -p "$GITHUB_WORKSPACE/build_src"

          unzip -q "$GITHUB_WORKSPACE/KM.zip" \
            -d "$GITHUB_WORKSPACE/build_src"

          echo "Android project extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/build_src"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_src" -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Force Google Play release configuration
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          // Final Google Play release configuration
          android {
              compileSdk 36

              defaultConfig {
                  versionCode 3
                  versionName "1.0.2"
                  targetSdk 36
              }

              buildTypes {
                  release {
                      debuggable false
                  }
              }
          }
          EOF

          echo "Version Code 3 / Version 1.0.2 / Target SDK 36 / Release debuggable false applied."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare upload signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KISAN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KISAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: KISAN_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KISAN_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d \
            > "$RUNNER_TEMP/kisan-mandi-upload-2026.p12"

          if [ ! -s "$RUNNER_TEMP/kisan-mandi-upload-2026.p12" ]; then
            echo "ERROR: Upload keystore could not be created."
            exit 1
          fi

          echo "Upload signing key prepared successfully."

      - name: Build release AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease --no-daemon

      - name: Check generated AAB
        shell: bash
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: app-release.aab was not generated."
            exit 1
          fi

          echo "Release AAB generated successfully."
          ls -lh "$AAB"

      - name: Sign release AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KISAN_KEYSTORE_PASSWORD }}
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          KEYSTORE="$RUNNER_TEMP/kisan-mandi-upload-2026.p12"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KISAN_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          cp "$AAB" "$RUNNER_TEMP/app-release-unsigned.aab"

          jarsigner \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$RUNNER_TEMP/app-release-signed.aab" \
            "$RUNNER_TEMP/app-release-unsigned.aab" \
            kisanmandi-upload-2026

          cp "$RUNNER_TEMP/app-release-signed.aab" "$AAB"

          echo "Release AAB signed successfully."

      - name: Verify AAB signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KISAN_KEYSTORE_PASSWORD }}
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          KEYSTORE="$RUNNER_TEMP/kisan-mandi-upload-2026.p12"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            "$AAB"

          echo ""
          echo "=========================================="
          echo "AAB SIGNATURE VERIFIED SUCCESSFULLY"
          echo "=========================================="

      - name: Final AAB check
        shell: bash
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          echo "Final signed AAB:"
          ls -lh "$AAB"

          echo "Package information:"
          unzip -p "$AAB" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties 2>/dev/null || true

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mandi-signed-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
