name: Kisan Mandi Android Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Android project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'kisan_mandi_v2.zip'
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

      - name: Extract Android project ZIP
        run: |
          rm -rf build_src
          mkdir -p build_src

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'kisan_mandi_v2.zip'
            -print -quit)

          unzip -q "$ZIP_FILE" -d build_src
          echo "Android project extracted successfully."

      - name: Find Android project
        run: |
          PROJECT_DIR=""

          SETTINGS_FILE=$(find build_src -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find build_src -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Fix Android Java and Kotlin JVM targets
        run: |
          cd "$PROJECT_DIR"

          APP_GRADLE="./app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            find . -maxdepth 4 -type f -name 'build.gradle' -print
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          if "compileOptions {" not in text:
              marker = "android {\n"
              fix = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """
              if marker not in text:
                  raise SystemExit("android block not found")
              text = text.replace(marker, fix, 1)

          elif "jvmTarget = '17'" not in text and "kotlinOptions {" not in text:
              marker = "}\n\ndependencies"
              fix = """}

          kotlinOptions {
              jvmTarget = '17'
          }

          dependencies"""
              if marker in text:
                  text = text.replace(marker, fix, 1)

          path.write_text(text)
          print("Java 17 and Kotlin 17 compatibility settings applied.")
          PY

          echo "Updated app/build.gradle:"
          cat app/build.gradle

      - name: Check Android project
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build Android AAB
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:bundleRelease --no-daemon
          else
            gradle :app:bundleRelease --no-daemon
          fi

      - name: Verify AAB
        run: |
          AAB_FILE="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."

            echo "Searching generated files:"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true

            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mandi-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
