name: Kisan Mandi Android Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project ZIP
        run: |
          mkdir -p build_src
          ZIP_FILE=$(find . -maxdepth 1 -name 'kisan_mandi_final_android_cloud_build_v20.zip' -print -quit)
          unzip -q "$ZIP_FILE" -d build_src

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find build_src -type f -name 'settings.gradle' -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Android AAB
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-mandi-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
